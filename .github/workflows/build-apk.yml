name: Build Salli native APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create the Android project files
        run: |
          if [ ! -d android ]; then
            flutter create --org com.salli --project-name salli_flutter --platforms android .
          fi

      - name: App name, internet permission
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="[^"]*"|android:label="Salli Native"|' $M
          grep -q 'android.permission.INTERNET' $M || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <application|' $M
          grep -q 'android.permission.USE_BIOMETRIC' $M || sed -i 's|<application|<uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <application|' $M

      - name: Fingerprint unlock support
        run: |
          F=$(find android/app/src/main -name 'MainActivity.kt' | head -1)
          if [ -n "$F" ]; then
            sed -i 's/import io.flutter.embedding.android.FlutterActivity/import io.flutter.embedding.android.FlutterFragmentActivity/; s/: FlutterActivity()/: FlutterFragmentActivity()/' "$F"
            cat "$F"
          fi

      - name: Phone notifications support
        run: |
          python3 - <<'PY'
          import glob, re
          # 1) desugaring (needed by flutter_local_notifications)
          for g in glob.glob('android/app/build.gradle*'):
              t = open(g).read()
              kts = g.endswith('.kts')
              if 'oreLibraryDesugaring' not in t:
                  flag = 'isCoreLibraryDesugaringEnabled = true' if kts else 'coreLibraryDesugaringEnabled true'
                  t = re.sub(r'compileOptions\s*\{', 'compileOptions {\n        ' + flag, t, count=1)
                  dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' if kts else "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
                  t += '\ndependencies {\n    ' + dep + '\n}\n'
                  open(g, 'w').write(t)
              print(open(g).read())
          # 2) receivers so scheduled reminders still arrive after a restart
          m = 'android/app/src/main/AndroidManifest.xml'
          t = open(m).read()
          if 'ScheduledNotificationReceiver' not in t:
              rec = ('<receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n'
                     '        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n'
                     '            <intent-filter>\n'
                     '                <action android:name="android.intent.action.BOOT_COMPLETED"/>\n'
                     '                <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>\n'
                     '                <action android:name="android.intent.action.QUICKBOOT_POWERON" />\n'
                     '                <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>\n'
                     '            </intent-filter>\n'
                     '        </receiver>\n    </application>')
              t = t.replace('</application>', rec, 1)
          for perm in ['android.permission.POST_NOTIFICATIONS', 'android.permission.RECEIVE_BOOT_COMPLETED']:
              if perm not in t:
                  t = t.replace('<application', '<uses-permission android:name="%s" />\n    <application' % perm, 1)
          open(m, 'w').write(t)
          print(t)
          PY

      - name: Compile every plugin against Android 36
        run: |
          cat > android/fix_sdk.gradle <<'GR'
          subprojects { p ->
              def fix = {
                  try {
                      if (p.plugins.hasPlugin('com.android.library')) {
                          p.android.compileSdk = 36
                          println "compileSdk 36 -> ${p.name}"
                      }
                  } catch (e) {
                      println "compileSdk fix skipped for ${p.name}: ${e.message}"
                  }
              }
              if (p.state.executed) { fix() } else { p.afterEvaluate { fix() } }
          }
          // The release lint check ("lintVital…") crashes on newer build tools inside plugins
          // (e.g. url_launcher_android). It only reports warnings, so it's switched off.
          allprojects { pr ->
              pr.tasks.configureEach { t ->
                  if (t.name.startsWith('lintVital')) { t.enabled = false }
              }
          }
          GR
          python3 - <<'PY'
          import glob
          for g in glob.glob('android/build.gradle*'):
              t = open(g).read()
              if 'fix_sdk.gradle' in t:
                  continue
              line = 'apply(from = "fix_sdk.gradle")\n' if g.endswith('.kts') else "apply from: 'fix_sdk.gradle'\n"
              i = t.find('subprojects')
              t = t[:i] + line + t[i:] if i >= 0 else t + '\n' + line
              open(g, 'w').write(t)
              print(t)
          PY

      - name: Plugin Java/Kotlin version fix
        run: |
          G=android/gradle.properties
          touch $G
          grep -q 'kotlin.jvm.target.validation.mode' $G || echo 'kotlin.jvm.target.validation.mode=warning' >> $G
          cat $G

      - run: flutter pub get

      - name: Code check (report only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Unit tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: Salli-native-apk
          path: build/app/outputs/flutter-apk/app-release.apk
