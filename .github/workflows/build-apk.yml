name: Build Salli native APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create the Android project files
        run: |
          if [ ! -d android ]; then
            flutter create --org com.salli --project-name salli_flutter --platforms android .
          fi

      - name: App name, internet permission
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="[^"]*"|android:label="Salli Native"|' $M
          grep -q 'android.permission.INTERNET' $M || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <application|' $M

      - run: flutter pub get

      - name: Code check (report only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Unit tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: Salli-native-apk
          path: build/app/outputs/flutter-apk/app-release.apk
